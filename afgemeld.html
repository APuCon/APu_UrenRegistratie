<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uitgelogd · APu Urenregistratie</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #102f3d; color: #fff;
           font-family: 'DM Sans', Arial, sans-serif; line-height: 1.6; padding: 24px; }
    main { max-width: 520px; }
    img { height: 48px; background: #fff; padding: 12px 16px; border-radius: 4px; }
    h1 { font-family: 'Manrope', Arial, sans-serif; font-weight: 550; font-size: 40px; letter-spacing: -1.6px; margin: 28px 0 8px; line-height: 1.15; }
    p { color: #d0dfe4; font-size: 17px; margin: 0 0 28px; }
    a { display: inline-block; background: #9bd7df; color: #173b49; font-weight: 650; font-size: 14px; padding: 15px 23px;
        border-radius: 3px; text-decoration: none; }
    a:hover { background: #c3e8ec; }
  </style>
</head>
<body>
  <main>
    <img src="/apu-logo.svg" alt="APu Consultancy" />
    <h1>Je bent uitgelogd.</h1>
    <p>Sluit je browser of log opnieuw in om verder te gaan met je urenregistratie.</p>
    <a href="/">Opnieuw inloggen</a>
  </main>
